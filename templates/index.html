<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Whiteboard</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<link rel="stylesheet" href="{{ url_for('static', filename='overrides.css') }}"><body>
<aside><header><h1>Notes</h1><button id="addNotebook">+ Notebook</button></header><div class="search"><input id="search" placeholder="Search all notes"><div id="results"></div></div><div id="tree"></div></aside>
<main><section id="empty"><h2>Start a notebook</h2><p>Create a subject notebook, then add pages for your notes.</p></section><section id="workspace" hidden><header id="topbar"><input id="pageTitle" aria-label="Page title"><div class="tools"><div class="tool-group"><button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button><button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button></div><div class="tool-group"><button data-tool="select" class="active" title="Select">⬌</button><button data-tool="pen" title="Draw">✏</button><button data-tool="highlighter" title="Highlight">🖍</button><button data-tool="text" title="Text">A</button><button data-tool="eraser" title="Erase">⌫</button></div><div class="tool-group" id="styleGroup"><input id="color" type="color" value="#263238" title="Tool color"><label class="brush">Size<input id="brushSize" type="range" min="1" max="30" value="6"></label><label class="brush" id="fontLabel" hidden>Font<input id="fontSize" type="range" min="10" max="48" value="16"></label></div><div class="tool-group"><button id="addNote" title="Add note">📌</button><button id="addText" title="Add text">📝</button><label class="upload" title="Upload image"><input id="upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>🖼</label></div><div class="tool-group"><button id="syncBtn" title="Push changes to GitHub">☁</button></div></div></header><div id="viewport"><div id="board"><svg id="strokes"></svg><div id="items"></div></div><div id="navContainer"><button class="nav-btn nav-up" title="Pan Up" data-dir="up">▲</button><button class="nav-btn nav-down" title="Pan Down" data-dir="down">▼</button><button class="nav-btn nav-left" title="Pan Left" data-dir="left">◄</button><button class="nav-btn nav-right" title="Pan Right" data-dir="right">►</button><button class="nav-btn nav-fit" id="fit" title="Fit view to content">⌖</button><button class="nav-btn nav-zoom-in" title="Zoom In" data-zoom="in">+</button><button class="nav-btn nav-zoom-out" title="Zoom Out" data-zoom="out">−</button><div id="joystick"><div id="joystick-stick"></div></div></div></div></section></main>
<template id="itemTemplate"><article class="item"><button class="delete" title="Delete">×</button><div class="resize"></div><div class="text-controls" hidden><button class="move-up" title="Move up" data-move="up">▲</button><button class="move-down" title="Move down" data-move="down">▼</button><button class="move-left" title="Move left" data-move="left">◄</button><button class="move-right" title="Move right" data-move="right">►</button><button class="size-up" title="Larger" data-size="up">+</button><button class="size-down" title="Smaller" data-size="down">−</button><button class="font-up" title="Font bigger" data-font="up">A↑</button><button class="font-down" title="Font smaller" data-font="down">A↓</button></div></article></template><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
