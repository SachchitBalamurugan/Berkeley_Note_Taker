<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Whiteboard</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<link rel="stylesheet" href="{{ url_for('static', filename='overrides.css') }}"><body>
<aside><header><h1>Notes</h1><button id="addNotebook">+ Notebook</button></header><div class="search"><input id="search" placeholder="Search all notes"><div id="results"></div></div><div id="tree"></div></aside>
<main><section id="empty"><h2>Start a notebook</h2><p>Create a subject notebook, then add pages for your notes.</p></section><section id="workspace" hidden><header id="topbar"><input id="pageTitle" aria-label="Page title"><div class="tools"><button id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button><button data-tool="select" class="active">Select</button><button data-tool="pen">Pen</button><button data-tool="highlighter">Highlighter</button><button data-tool="eraser">Eraser</button><input id="color" type="color" value="#263238" title="Tool color"><label class="brush">Size <input id="brushSize" type="range" min="1" max="30" value="6"><output id="brushValue">6</output></label><button id="addNote">+ Note</button><button id="addText">+ Text</button><label class="upload">Upload image<input id="upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label><button id="syncBtn" title="Push changes to GitHub">☁ Sync</button></div></header><div id="viewport"><div id="board"><svg id="strokes"></svg><div id="items"></div></div><div id="navContainer"><button class="nav-btn nav-up" title="Pan Up" data-dir="up">▲</button><button class="nav-btn nav-down" title="Pan Down" data-dir="down">▼</button><button class="nav-btn nav-left" title="Pan Left" data-dir="left">◄</button><button class="nav-btn nav-right" title="Pan Right" data-dir="right">►</button><button class="nav-btn nav-fit" id="fit" title="Fit view to content">⌖</button><button class="nav-btn nav-zoom-in" title="Zoom In" data-zoom="in">+</button><button class="nav-btn nav-zoom-out" title="Zoom Out" data-zoom="out">−</button></div></div></section></main>
<template id="itemTemplate"><article class="item"><button class="delete" title="Delete">×</button><div class="resize"></div></article></template><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
